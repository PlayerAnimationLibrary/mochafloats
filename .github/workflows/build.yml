name: 'build'
on:
    push:
        branches: [ 'main' ]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Branch
              uses: actions/checkout@v7

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: microsoft
                  java-version: 25
                  cache: gradle

            # the tests compare with expectations.txt, which MolangJS generates from tests.txt
            - name: Check MolangJS Expectations
              run: |
                  ./gradlew :runtime-compiler:generateExpectations
                  git diff --exit-code -- runtime-compiler/src/test/resources/expectations.txt

            - name: Build
              run: ./gradlew build
