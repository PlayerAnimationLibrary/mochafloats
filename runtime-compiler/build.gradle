plugins {
    id "org.jetbrains.kotlin.jvm"
}

dependencies {
    api project(":runtime")

    testImplementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.20")
}

// Regenerates src/test/resources/expectations.txt with MolangJS (needs Node.js).
// Run it after changing tests.txt; the tests use the committed file, and CI checks it's up to date.
tasks.register('generateExpectations', Exec) {
    workingDir = rootProject.projectDir
    def nvmDir = file("${System.getenv('HOME')}/.nvm/versions/node")
    executable nvmDir.isDirectory() ? "${nvmDir.listFiles().sort().last()}/bin/node" : 'node'
    args 'scripts/generate_expectations.js'
}

tasks.named("compileTestKotlin") {
    enabled = true
}
